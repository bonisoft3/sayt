name: sayt/ci
description: |
  Run a project's `ci` bake-cascade target. Presets `sayt/integrate` with
  the envelope build axis (`--bake --no-up`) and `target: ci`. Use it when
  your compose graph has a `ci` target that drives the test cascade; use
  `sayt/integrate` directly when you run `integrate` itself.
inputs:
  target-dir:
    description: Directory containing the project's compose.yaml.
    required: true
  target:
    description: Bake target to invoke. Defaults to `ci` — the standard cascade entry point.
    required: false
    default: "ci"
  mode:
    description: |
      Passthrough to `sayt/integrate`'s build-axis sugar. `bake` (default):
      the target's own RUN drives the whole cascade (the envelope pattern).
      `ci`: build via bake, then fall through to an outer `compose up` — for
      a target whose RUN only builds and doesn't run anything itself.
    required: false
    default: "bake"
  with-buildx:
    description: |
      Inject the host buildx builder into the build (`--with-buildx`).
      `true` (default): the target's RUN itself invokes a nested bake (the
      standard `ci` cascade needs this). Set `false` for a target whose RUN
      only pulls and runs pre-built images — nothing in it uses a builder,
      so injecting one is pure waste.
    required: false
    default: "true"
  cache-from:
    description: Passthrough.
    required: false
    default: "true"
  cache-to:
    description: Passthrough.
    required: false
    default: "true"
  buildkitd-flags:
    description: Optional extra buildkitd flags. Passthrough.
    required: false
    default: ""
  buildkitd-config-inline:
    description: |
      Optional inline TOML buildkitd config. Passthrough. Use to raise gRPC
      limits for large bake graphs (`[grpc] max_recv_msg_size = ...`).
    required: false
    default: ""
  buildkit-syntax:
    description: Passthrough to `sayt/integrate` (see its input of the same name).
    required: false
    default: ""
  distro-path:
    description: Passthrough to `sayt/integrate` (see its input of the same name).
    required: false
    default: ""
  summary-name:
    description: Project label for the cache-hit summary section. Passthrough; defaults to basename of `target-dir`.
    required: false
    default: ""
  debug:
    description: |
      Passthrough to `sayt/integrate` and `sayt/summary`. When `'true'`,
      the summary action expands with misses table, per-record breakdown,
      and chain-ID divergence probe; bake/cache emit extra diagnostics.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Compute capability flags
      id: compute
      shell: bash
      env:
        WITH_BUILDX: ${{ inputs.with-buildx }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
      run: |
        flags="--dind-bridge"
        [ "$WITH_BUILDX" = "true" ] && flags="$flags --with-buildx"
        [ "$CACHE_FROM" = "true" ] || flags="$flags --no-cache-from"
        [ "$CACHE_TO" = "true" ] || flags="$flags --no-cache-to"
        echo "flags=$flags" >> "$GITHUB_OUTPUT"

    # action-cache: false — see sayt/integrate's action-cache doc.
    - uses: bonisoft3/sayt/.github/actions/sayt/integrate@v0.26.0
      with:
        target-dir: ${{ inputs.target-dir }}
        target: ${{ inputs.target }}
        mode: ${{ inputs.mode }}
        flags: ${{ steps.compute.outputs.flags }}
        action-cache: "false"
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
        buildkit-syntax: ${{ inputs.buildkit-syntax }}
        distro-path: ${{ inputs.distro-path }}
        summary-name: ${{ inputs.summary-name }}
        debug: ${{ inputs.debug }}
