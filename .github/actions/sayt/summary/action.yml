name: sayt/summary
description: |
  Post a buildx cache-hit summary to the job summary and upload a
  `.dockerbuild` artifact for sayt/integrate jobs. One headline line by
  default; `debug: 'true'` adds the miss and unresolved tables, plus a
  per-record breakdown on builders that have the history API.
  Builders without the build-history API (depot) are read from a captured
  `--progress plain` log instead — see `progress-log`.
  Intra-record chain-ID divergence is ALWAYS checked and fails the step —
  it's always a bug. Call with `if: always()`.
inputs:
  name:
    description: Project label for the summary heading + artifact suffix (keep it short).
    required: true
  builder:
    description: |
      buildx builder name (the `name` output of setup-buildx-action). Empty
      falls back to the daemon default, which has no build history.
    required: false
    default: ""
  artifact-prefix:
    description: |
      Artifact filename prefix. Defaults to `<owner>~<repo>~` — the shape the
      GHA Build Summary widget recognizes.
    required: false
    default: ""
  debug:
    description: |
      `'true'` expands the summary with the miss and unresolved tables, and the
      per-record breakdown where there are records. Default keeps just the
      headline. (Chain-ID divergence is checked regardless and fails the step.)
    required: false
    default: "false"
  progress-log:
    description: |
      Path to a captured `--progress plain` log, read when the builder exposes
      no build-history API (depot). Yields the same headline over the same step
      definition, from CACHED/DONE evidence rather than a `cached` flag;
      chain-ID divergence and the `.dockerbuild` export need vertex digests the
      log lacks, so both are skipped.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Resolve the artifact path up front; the upload step always points here
    # and `if-no-files-found: ignore` keeps the job green when export fails.
    - name: Resolve artifact path
      id: artifact
      shell: bash
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        SAYT_SUMMARY_NAME: ${{ inputs.name }}
      run: |
        prefix="$ARTIFACT_PREFIX"
        if [ -z "$prefix" ]; then
          repo="${GITHUB_REPOSITORY:-unknown/unknown}"
          owner="${repo%%/*}"
          reponame="${repo##*/}"
          prefix="${owner}~${reponame}~"
        fi
        path="${RUNNER_TEMP:-/tmp}/sayt-summary-${SAYT_SUMMARY_NAME}.dockerbuild"
        {
          echo "name=${prefix}${SAYT_SUMMARY_NAME}.dockerbuild"
          echo "path=$path"
        } >> "$GITHUB_OUTPUT"

    - name: Compute cache-hit summary
      shell: bash
      env:
        BUILDX_BUILDER: ${{ inputs.builder }}
        SAYT_SUMMARY_NAME: ${{ inputs.name }}
        SAYT_SUMMARY_OUT: ${{ steps.artifact.outputs.path }}
        SAYT_SUMMARY_DEBUG: ${{ inputs.debug }}
        SAYT_SUMMARY_PROGRESS_LOG: ${{ inputs.progress-log }}
      run: |
        set -u
        name="$SAYT_SUMMARY_NAME"
        debug="$SAYT_SUMMARY_DEBUG"

        # `docker buildx history ls --format json` returns JSONL with one
        # record per build, including summary fields (cached_steps,
        # completed_steps, total_steps, created_at, completed_at). Avoids
        # the truncation of the default table view.
        ls_json=$(docker buildx history ls --format json 2>/dev/null || true)
        refs=$(echo "$ls_json" | jq -r 'select(.ref) | .ref' 2>/dev/null || true)
        if [ -z "$refs" ]; then
          # The step definition (RUN/ADD vertices, COPY excluded) must stay
          # identical to the rawjson path below, or the two builders' headlines
          # stop being comparable. The hit rule cannot be: the log carries no
          # `cached` flag, only the CACHED/DONE lines buildkit prints, so cache
          # state is read off evidence of execution instead.
          #
          # Keyed by vertex id — the unit buildkit makes the cache decision on.
          # `[target N/M]` is a display label, and a vertex is printed under every
          # target that consumes it, so one id carries several of them.
          if [ -n "${SAYT_SUMMARY_PROGRESS_LOG:-}" ] && [ -s "${SAYT_SUMMARY_PROGRESS_LOG:-}" ]; then
            # MISS0 is a miss that transferred nothing (`ADD --checksum` re-resolves
            # the remote digest at no wall-clock cost); tabled apart so the
            # actionable list stays short. UNRESOLVED is neither CACHED nor DONE:
            # buildkit resolved the vertex to an already-materialized ref and never
            # scheduled it, so it is neither a hit nor a miss and leaves the ratio.
            parsed_txt=$(awk '
              /^#[0-9]+ / {
                id = substr($1, 2); rest = substr($0, length($1) + 2)
                sub(/[[:space:]]+$/, "", rest)
                if (rest ~ /^\[[^]]+ [0-9]+\/[0-9]+\] (RUN|ADD) /) {
                  if (!(id in alias)) { alias[id] = rest; ids[++n] = id }
                  else if (index(alias[id], rest) == 0) alias[id] = alias[id] "\037" rest
                  next
                }
                if (rest == "CACHED") { cached[id] = 1; next }
                if (rest ~ /^DONE [0-9.]+s$/) {
                  split(rest, d, " "); sub(/s$/, "", d[2])
                  if (d[2] + 0 > dur[id]) dur[id] = d[2] + 0
                  ran[id] = 1
                  next
                }
              }
              END {
                for (j = 1; j <= n; j++) {
                  id = ids[j]
                  if (cached[id]) { h++; continue }
                  if (ran[id]) { m++; printf "%s\t%s\t%.1f\t%s\n", (dur[id] > 0 ? "MISS" : "MISS0"), id, dur[id], alias[id] }
                  else { u++; printf "UNRESOLVED\t%s\t0.0\t%s\n", id, alias[id] }
                }
                printf "TOTAL\t%d\t%d\t%d\n", h, m, u
              }' "$SAYT_SUMMARY_PROGRESS_LOG")
            hit=$(printf '%s\n' "$parsed_txt" | awk -F'\t' '$1=="TOTAL"{print $2}')
            miss=$(printf '%s\n' "$parsed_txt" | awk -F'\t' '$1=="TOTAL"{print $3}')
            unresolved=$(printf '%s\n' "$parsed_txt" | awk -F'\t' '$1=="TOTAL"{print $4}')
            tot=$(( ${hit:-0} + ${miss:-0} ))

            # Table rows for one verdict, slowest first; $2='1' adds the duration
            # cell. All of a vertex's labels are rendered.
            rows() {
              printf '%s\n' "$parsed_txt" \
                | awk -F'\t' -v want="$1" '$1==want' \
                | sort -t$'\t' -k3,3gr -k2,2n \
                | awk -F'\t' -v dur="$2" '{
                    n = split($4, a, "\037"); s = ""
                    for (i = 1; i <= n; i++) s = s (i > 1 ? "<br>" : "") "`" a[i] "`"
                    if (dur == "1") printf "| %s | %ss |\n", s, $3
                    else printf "| %s |\n", s
                  }'
            }

            {
              echo "## ${name} bake cache summary"
              echo ""
              if [ "$tot" -gt 0 ]; then
                pct=$((hit * 100 / tot))
                marker=$([ "$hit" = "$tot" ] && echo "✅" || echo "⚠️")
                note=""
                [ "${unresolved:-0}" -gt 0 ] && note=" ${unresolved} never ran (excluded)."
                echo "${marker} **${hit}/${tot}** Dockerfile build steps hit cache (${pct}%), read from the build log.${note}"
              else
                echo "_(no Dockerfile build steps ran in \`$SAYT_SUMMARY_PROGRESS_LOG\`)_"
              fi
              echo ""
              echo "<sub>This builder does not implement buildx's build-history API, so the count comes from the \`--progress plain\` log. The step definition matches the rawjson path (RUN/ADD, COPY excluded). The hit rule cannot: the log carries no \`cached\` flag, so \`CACHED\` is a hit, \`DONE\` without \`CACHED\` is a miss, and a vertex with neither never ran and is excluded from both sides of the ratio. Counting is per vertex id — one id is printed under every target that consumes it, so step names are labels, not keys. Chain-ID divergence and the \`.dockerbuild\` export need vertex digests the log does not carry, and are skipped.</sub>"
            } | tee -a "$GITHUB_STEP_SUMMARY"

            if [ "$debug" = "true" ]; then
              n_slow=$(printf '%s\n' "$parsed_txt" | awk -F'\t' '$1=="MISS"' | wc -l | tr -d ' ')
              n_free=$(printf '%s\n' "$parsed_txt" | awk -F'\t' '$1=="MISS0"' | wc -l | tr -d ' ')
              {
                if [ "$n_slow" -gt 0 ]; then
                  echo ""
                  echo "### Misses (${n_slow}, slowest first)"
                  echo ""
                  echo "| step | duration |"
                  echo "| --- | --- |"
                  rows MISS 1
                fi
                if [ "$n_free" -gt 0 ]; then
                  echo ""
                  echo "### Zero-cost misses (${n_free})"
                  echo ""
                  echo "<sub>Real misses that transferred nothing — the remote digest is re-resolved but no bytes move. Folding these into the list above makes a clean build look dirty.</sub>"
                  echo ""
                  echo "| step | duration |"
                  echo "| --- | --- |"
                  rows MISS0 1
                fi
                if [ "${unresolved:-0}" -gt 0 ]; then
                  echo ""
                  echo "### Unresolved (${unresolved}, excluded from the ratio)"
                  echo ""
                  echo "<sub>Neither \`CACHED\` nor \`DONE\`: buildkit resolved the vertex to an already-materialized ref and never scheduled it. Neither a hit nor a miss.</sub>"
                  echo ""
                  echo "| step |"
                  echo "| --- |"
                  rows UNRESOLVED 0
                fi
              } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          {
            echo "## ${name} bake cache summary"
            echo ""
            echo "_(no build records — bake step likely failed before reaching buildkit)_"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "::group::docker buildx history ls --format json"
        echo "$ls_json"
        echo "::endgroup::"

        # Pull each ref's rawjson once and stash in a tmpdir.
        tmpdir=$(mktemp -d)
        for ref in $refs; do
          uid="${ref##*/}"
          if out=$(docker buildx history logs --progress rawjson "$uid" 2>&1); then
            printf '%s\n' "$out" | awk '/^\{/' > "$tmpdir/$uid.rawjson"
          else
            : > "$tmpdir/$uid.rawjson"
          fi
        done

        # jq prelude. A "build step" = a RUN/ADD vertex — the instructions that
        # do real, cacheable compute. COPY is deliberately excluded: COPY layers
        # are cheap data movement whose cache state is inherently noisy. Implicit
        # parent-directory creation stamps a build-time mtime, so the
        # materialized layer digest floats run-to-run even when the copied
        # content is identical — yet the cross-stage content key that downstream
        # consumers key off is mtime-insensitive, so the float is harmless. We
        # don't cache COPY layers (no cross-builder cache; depot uses its
        # builder-native cache; plain buildkit caches the RUN layers that
        # matter), and a COPY that genuinely changed something always surfaces as
        # a miss on the RUN that consumes it — so excluding COPY cannot hide a
        # real regression.
        #
        # The unit is one execution of one vertex: `(digest, started)`. Digest is
        # what buildkit decides the cache on; `started` is what tells a genuine
        # re-execution apart from the copies concurrent bakes report of one shared
        # execution, which carry byte-identical timestamps.
        #
        # `[target N/M]` is a display label — one vertex is named once per
        # consuming target — so labels are collected in announce order for
        # rendering and never used as a key. Verdicts are the progress-log arm's,
        # above. Duration never decides a verdict (cache-mount RUNs take seconds
        # on a hit); it only splits misses that moved bytes from those that
        # did not.
        #
        # The synthetic clamp RUN (`find /monorepo -newer /tmp/ref … touch`) is a
        # cacheable step like any other, so it's counted: a clamp that starts
        # missing is the leading edge of a ci-RUN cascade.
        jq_filter='
          def epoch: capture("^(?<t>[^.Z]+)(\\.(?<f>[0-9]+))?Z$")
            | ((.t + "Z") | fromdateiso8601)
              + (if .f then ("0." + .f | tonumber) else 0 end);
          def steps:
            [.[]?.vertexes // []] | flatten
            | map(select((.name // "") | test("^\\[[^\\]]+ [0-9]+/[0-9]+\\] (RUN|ADD) ")))
            | group_by(.digest)
            | map((map(.name) | reduce .[] as $n ([]; if index($n) then . else . + [$n] end)) as $names
                  | (map(select(.started != null)) | group_by(.started)) as $execs
                  | if ($execs | length) == 0
                    then [{names: $names, cached: false, ran: false, started: null, dur: 0}]
                    else $execs
                         | map({names:   $names,
                                cached:  (any(.[]; .cached == true)),
                                ran:     (any(.[]; .completed != null)),
                                started: .[0].started,
                                dur:     ([.[] | select(.completed != null)
                                           | ((.completed | epoch) - (.started | epoch))] | max // 0)})
                    end)
            | flatten
            | map(.dur |= ((. * 10 | round) / 10))
            | map(.verdict = (if .cached      then "hit"
                              elif (.ran | not) then "unresolved"
                              elif .dur > 0   then "miss"
                              else "miss0" end));
        '

        # One pass over every record: the execution key already collapses the
        # vertices concurrent bakes share, so records are read together rather
        # than summed. The per-record column below can therefore total more than
        # this headline — a shared vertex counts once here and once per record
        # that referenced it there.
        parsed=$(cat "$tmpdir"/*.rawjson 2>/dev/null | jq -s "$jq_filter"'
          steps as $real
          | def of(v): $real | map(select(.verdict == v));
            { hit:        (of("hit")        | length),
              miss:       (of("miss")       | length),
              miss0:      (of("miss0")      | length),
              unresolved: (of("unresolved") | length),
              misses:     (of("miss")       | sort_by(-.dur)),
              zero:       (of("miss0")      | sort_by(.started // "")),
              unres:      (of("unresolved") | sort_by(.started // "")) }
        ' 2>/dev/null || echo '{}')
        hit=$(echo        "$parsed" | jq -r '.hit        // 0')
        n_misses=$(echo   "$parsed" | jq -r '.miss       // 0')
        n_zero=$(echo     "$parsed" | jq -r '.miss0      // 0')
        unresolved=$(echo "$parsed" | jq -r '.unresolved // 0')
        total=$((hit + n_misses + n_zero))
        n_refs=$(echo "$refs" | wc -l | tr -d ' ')

        # Table rows for one verdict, as the progress-log arm renders them:
        # $1 = key in $parsed, $2 = '1' to add the duration cell. Durations are
        # printed to a fixed tenth so the two arms' tables compare byte for byte —
        # jq would otherwise drop the decimal on a whole number.
        rows() {
          echo "$parsed" | jq -r --arg k "$1" --arg dur "$2" '
            def tenths: (. * 10 | round) as $t | "\(($t / 10) | floor).\($t % 10)";
            .[$k][]?
            | (.names | map("`\(.)`") | join("<br>")) as $s
            | if $dur == "1" then "| \($s) | \(.dur | tenths)s |" else "| \($s) |" end'
        }

        # Headline — always emitted.
        {
          echo "## ${name} bake cache summary"
          echo ""
          if [ "$total" -gt 0 ]; then
            pct=$((hit * 100 / total))
            marker=$([ "$hit" = "$total" ] && echo "✅" || echo "⚠️")
            note=""
            [ "$unresolved" -gt 0 ] && note=" ${unresolved} never ran (excluded)."
            echo "${marker} **${hit}/${total}** Dockerfile build steps hit cache (${pct}%) across **${n_refs}** build records.${note}"
          else
            echo "_(no Dockerfile build steps ran — bake graph was entirely \`[internal]\` ops?)_"
          fi
          echo ""
          echo "<details><summary>How the count is computed</summary>"
          echo ""
          echo "A **Dockerfile build step** is a vertex whose name matches \`[target stage N/M] (RUN|ADD) ...\` — the instructions that do real, cacheable compute. Metadata-only instructions (FROM, WORKDIR, ENV, LABEL, etc.) and \`[internal]\` ops are excluded; buildkit emits vertices for them but doesn't mark \`cached:true\` even on a true no-op. **\`COPY\` is excluded too**: COPY layers are cheap data movement, and their cache state is inherently noisy — implicit parent-directory creation stamps a build-time mtime, so the materialized layer digest floats run-to-run even when the copied content is identical. We don't cache COPY layers (no cross-builder cache; depot uses its builder-native cache; plain buildkit caches the RUN layers that matter), and a COPY that genuinely changed something always surfaces as a miss on the RUN that consumes it — so excluding COPY cannot hide a real regression. The bayt synthetic mtime-clamp RUN (\`find /monorepo -newer /tmp/ref …\`) **is** counted: synthetics carry project-qualified cache tags and \`mode=max\`, so the clamp caches on warm like any other step — a clamp that starts missing is the leading edge of a ci-RUN cascade, exactly what this metric should surface."
          echo ""
          echo "Counting is per vertex **execution** — a \`(digest, started)\` pair. The digest is what buildkit makes the cache decision on; \`started\` separates repeat executions of one digest, so a warm hit cannot swallow a cold miss of the same step, while the copies concurrent bakes report of one shared execution still collapse to a single count. A step name is a display label, not a key: one vertex is named once per target that consumes it. A **hit** is buildkit's \`cached\` flag on any of the execution's events. A **miss** is a completion event without it. A vertex with **neither** was resolved to an already-materialized ref and never scheduled: it did not hit and it did not miss, so it is reported separately and excluded from both sides of the ratio."
          echo ""
          echo "</details>"
        } | tee -a "$GITHUB_STEP_SUMMARY"

        # Chain-ID divergence (intra-record) — ALWAYS checked; it fails the step
        # (below) because it is always a bug: one logical stage computed under two
        # distinct chain IDs with differing cache outcomes means cache-from can
        # match at most one. Same-state duplicates are emission noise; skipped.
        # The loop is per-record, so cross-record divergence (outer LOCAL bake vs.
        # inner DEPOT bake — different builders, never a shared chain ID) is
        # excluded by construction: expected, not a bug. The synthetic clamp RUN
        # (`find /monorepo -newer /tmp/ref …`) is excluded HERE: the shared `_ctxs`
        # stage is reached through many federation parents (every consumer's
        # build_srcs, the ci target, …), so one `[<parent> <stage>_ctxs N/N]` name
        # legitimately maps to several vertex IDs/digests with differing cache
        # outcomes. That is the federation graph, not a chain-ID bug — counting it
        # would false-positive the divergence gate. (The hit metric DOES count the
        # clamp; keying by digest keeps the collision harmless there.)
        #
        # Vertices that never ran are dropped before the comparison: an unscheduled
        # chain ID has no cache outcome to diverge from, and pairing one with a
        # cached sibling would fail the job over nothing.
        divergence=""
        for f in "$tmpdir"/*.rawjson; do
          [ -s "$f" ] || continue
          rec_div=$(jq -rs '
            [.[]?.vertexes // []] | flatten
            | map(select(((.name // "") | test("^\\[[^\\]]+ [0-9]+/[0-9]+\\] (RUN|ADD) "))
                         and (((.name // "") | test("find /monorepo -newer /tmp/ref")) | not)))
            | group_by(.name)
            | map({name: .[0].name,
                   per_digest: (group_by(.digest)
                                | map({digest: .[0].digest,
                                       cached: any(.[]; .cached == true),
                                       ran:    any(.[]; .completed != null)})
                                | map(select(.cached or .ran)))})
            | map(select((.per_digest | length) > 1))
            | map(select((.per_digest | map(.cached) | unique | length) > 1))
            | .[]
            | "| `\(.name)` | \(.per_digest | length) | \(.per_digest | map("\(.digest) (cached=\(.cached))") | join("<br>")) |"
          ' "$f" 2>/dev/null || true)
          [ -n "$rec_div" ] && divergence+="$rec_div"$'\n'
        done
        if [ -n "$divergence" ]; then
          {
            echo ""
            echo "### ❌ Chain-ID divergence — same stage, different cached state (intra-record)"
            echo ""
            echo "<sub>One logical step computed under two distinct chain IDs with differing cache outcomes — \`cache-from\` in the next run can match at most one of them. **This is always a bug and fails the job.** Cross-record divergence (outer local bake vs. inner depot bake) is excluded by construction — different builders, never a shared chain ID.</sub>"
            echo ""
            echo "| stage | distinct digests | digests |"
            echo "| --- | --- | --- |"
            echo "$divergence"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        fi

        # Debug sections (gated on debug): verdict tables, per-record breakdown.
        if [ "$debug" = "true" ]; then
          # Per-record rows: same hit/total filter, one rawjson at a time,
          # joined to ls_json (by uid) for the record name + timing.
          per_record_rows=""
          for f in "$tmpdir"/*.rawjson; do
            [ -s "$f" ] || continue
            ruid=$(basename "$f" .rawjson)
            meta=$(echo "$ls_json" | jq -c --arg uid "$ruid" 'select(.ref | endswith($uid))' | head -n 1)
            if [ -z "$meta" ]; then
              rec_name="(record $ruid)"
              rec_created="—"
              rec_dur="—"
            else
              rec_name=$(jq -r '.name' <<<"$meta")
              rec_created=$(jq -r '.created_at' <<<"$meta")
              rec_dur=$(jq -r '
                def to_epoch: sub("\\.[0-9]+Z$"; "Z") | fromdate;
                if .completed_at and .created_at
                then (((.completed_at | to_epoch) - (.created_at | to_epoch)) | tostring + "s")
                else "—" end' <<<"$meta")
            fi
            ht=$(jq -rs "$jq_filter"'
              steps
              | "\(map(select(.verdict == "hit")) | length)/\(map(select(.verdict != "unresolved")) | length)"' "$f" 2>/dev/null || echo "?/?")
            per_record_rows+="| \`$rec_name\` | $ht | $rec_dur | $rec_created |"$'\n'
          done

          {
            if [ "$n_misses" -gt 0 ]; then
              echo ""
              echo "### Misses (${n_misses}, slowest first)"
              echo ""
              echo "| step | duration |"
              echo "| --- | --- |"
              rows misses 1
            fi
            if [ "$n_zero" -gt 0 ]; then
              echo ""
              echo "### Zero-cost misses (${n_zero})"
              echo ""
              echo "<sub>Real misses that transferred nothing — the remote digest is re-resolved but no bytes move. Folding these into the list above makes a clean build look dirty.</sub>"
              echo ""
              echo "| step | duration |"
              echo "| --- | --- |"
              rows zero 1
            fi
            if [ "$unresolved" -gt 0 ]; then
              echo ""
              echo "### Unresolved (${unresolved}, excluded from the ratio)"
              echo ""
              echo "<sub>No \`cached\` flag and no completion event: buildkit resolved the vertex to an already-materialized ref and never scheduled it. Neither a hit nor a miss.</sub>"
              echo ""
              echo "| step |"
              echo "| --- |"
              rows unres 0
            fi

            echo ""
            echo "### Per-record summary (${n_refs} build records)"
            echo ""
            echo "| record | hit / total | record duration | created |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$per_record_rows" | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
        fi

        # Export the newest record as the .dockerbuild for the GHA widget (one
        # record per artifact). Its own "X/Y cached" header underreports — the
        # headline above is the truth.
        for ref in $refs; do
          uid="${ref##*/}"
          if err=$(docker buildx history export --output "$SAYT_SUMMARY_OUT" "$uid" 2>&1); then
            echo "exported $uid to $SAYT_SUMMARY_OUT"
            break
          else
            printf 'history export failed for %s: %s\n' "$uid" "$err"
          fi
        done

        # Chain-ID divergence is always a bug → fail the job. The table is in the
        # summary above; export ran first so the .dockerbuild still uploads.
        if [ -n "$divergence" ]; then
          echo "::error::sayt/summary (${name}): chain-ID divergence detected — always a bug. See the job summary."
          exit 1
        fi

    - name: Upload Build Summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ steps.artifact.outputs.path }}
        if-no-files-found: ignore
