name: sayt/integrate
description: |
  Build + run a project's integration flow via `sayt integrate`. A thin
  wrapper: it assembles `sayt integrate <mode-flags> <flags> --target
  <target>` from the caller's inputs and runs it — the build axis,
  capability flags, docker-in-docker bridging, and the builder to use
  (`--with-buildx` resolves its own injection target when none is named
  — see `sayt integrate --help`) are all `sayt integrate`'s own concern,
  not this action's; it just makes sure a builder exists and is active
  by default. `mode` is sugar for the three common axis shapes; `flags`
  is a raw escape hatch for anything else. The digest-probe + marker
  cache (`action-cache: true`, default) wraps the call to skip a re-run
  when nothing changed; it never reimplements what the call does.
inputs:
  target-dir:
    description: Directory containing compose.yaml for the integration flow.
    required: false
    default: "."
  target:
    description: |
      Compose service or bake target to build + run, per whichever axis
      `mode`/`flags` selects. Ignored under `mode: local`, which never
      passes `--target` (see `mode`).
    required: false
    default: "integrate"
  mode:
    description: |
      Build-axis sugar — expands to flags prepended to `flags` below.
      `local`: `sayt integrate <flags>` — no `--target`, no axis flags.
      A project's `say.integrate.args` in `.say.yaml` applies only when
      the CLI is invoked with zero args, so this is the one mode that
      actually lets it take effect — exactly what a developer's own bare
      `sayt integrate` produces. `compose` (default): the same axis, but
      always states `--target` explicitly — any non-empty args suppress
      `.say.yaml`'s own default, so this is deterministic build+up
      regardless of what a project configures as its local default.
      `bake`: `--bake --no-up` — build only; use when the bake target's
      own RUN drives the whole cascade (the envelope pattern) and its
      exit code is the verdict. `ci`: `--bake` — build via bake, then
      fall through to an outer `compose up`, which runs on the runner
      directly (not inside any RUN), so it needs no daemon bridge unless
      a capability flag in `flags` asks for one.
    required: false
    default: "compose"
  flags:
    description: |
      Extra flags forwarded to `sayt integrate`, appended after whatever
      `mode` expands to — capability flags (`--dind`, `--dind-bridge`,
      `--with-buildx`, `--with-kube`, `--with-testcontainers`,
      `--with-host-env`), `--no-build`, cache escape hatches, or `--builder
      <name>` to point at a builder other than the active one (e.g. a
      depot builder set up via `depot configure-docker`, where outer and
      inner need different builders for network-reachability reasons).
      `--with-buildx` resolves its own injection target from the active
      builder when `--builder` is omitted, so this is rarely needed.
    required: false
    default: ""
  debug:
    description: Enable extra debug logging for bake/cache.
    required: false
    default: "false"
  buildkitd-flags:
    description: Optional extra buildkitd flags (appended to defaults).
    required: false
    default: ""
  buildkitd-config-inline:
    description: |
      Optional inline TOML buildkitd config (appended). Use to raise gRPC
      limits for large bake graphs (`[grpc] max_recv_msg_size = ...`).
    required: false
    default: ""
  distro-path:
    description: |
      Passthrough to `sayt/install`. Empty installs the released sayt via
      the repo's committed saytw wrapper (or the public install script).
    required: false
    default: ""
  buildkit-syntax:
    description: |
      External dockerfile frontend ref (BUILDKIT_SYNTAX build-arg). Empty
      (default) uses the builder's built-in frontend. `sayt/depot` sets it.
    required: false
    default: ""
  action-cache:
    description: |
      `true` (default): probe the target's build digest and skip the run
      when a prior run already passed with the same digest (via
      `actions/cache`). `false`: always run `sayt integrate` directly — the
      right choice whenever `flags`/`mode` already carry their own verdict
      (e.g. the `--bake --no-up` envelope, where the bake RUN's exit code
      is the test result and there's nothing left for a marker to gate).
      Never active under `mode: local` regardless of this input (see
      `Resolve cache gate`).
    required: false
    default: "true"
  action-cache-scope:
    description: |
      Scope prefix for the default `action-cache-from`/`-to` (e.g.
      `pr-1261`). Empty disables the defaults (no cache wiring unless set).
    required: false
    default: ""
  action-cache-from:
    description: |
      Bake `cache-from` specs (newline-separated). Empty + a scope →
      GHA per-scope + main fallback; empty + no scope → compose `x-bake` wins.
    required: false
    default: ""
  action-cache-to:
    description: |
      Bake `cache-to` spec. Empty + a scope → GHA `mode=max`; empty + no
      scope → compose `x-bake` wins.
    required: false
    default: ""
  action-cache-target-pattern:
    description: |
      Target glob the cache wiring applies to. Default: the single `target`;
      set `*` for multi-target cascades.
    required: false
    default: ""
  summary-name:
    description: |
      Label for the cache-hit summary + `.dockerbuild` artifact. Defaults to
      the `target-dir` basename.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      with:
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        # Pin buildkit by digest: cache-key determinism needs identical
        # buildkit across runs. Bump deliberately.
        driver-opts: image=mirror.gcr.io/moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
        # mirror.gcr.io: dodge Docker Hub's anonymous pull cap on buildkit pulls.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
          ${{ inputs.buildkitd-config-inline }}

    - name: Install sayt
      uses: bonisoft3/sayt/.github/actions/sayt/install@v0.28.1
      with:
        distro-path: ${{ inputs.distro-path }}

    - name: Install mise
      uses: jdx/mise-action@v4

    # Pin worktree mtimes to a fixed instant before any build, after the
    # installs so generated files are covered too, for deterministic
    # file-entry mtimes in the COPY layers.
    - name: Pin mtimes
      shell: bash
      run: find . -name .git -prune -o -exec touch -h -d "2000-01-01T00:00:00Z" {} +

    # mode: local defers entirely to .say.yaml, which may build a different
    # target than `target` names (or nothing at all) — a digest keyed on
    # `target` would gate the wrong thing, so caching never activates there.
    - name: Resolve cache gate
      id: cache-gate
      shell: bash
      env:
        ACTION_CACHE: ${{ inputs.action-cache }}
        MODE: ${{ inputs.mode }}
      run: |
        if [ "$ACTION_CACHE" = "false" ] || [ "$MODE" = "local" ]; then
          echo "active=false" >> "$GITHUB_OUTPUT"
        else
          echo "active=true" >> "$GITHUB_OUTPUT"
        fi

    # Flatten with `docker compose config -o` before the digest-probe bake —
    # sidesteps bake-on-federated-compose context-doubling + service-collision
    # bugs. Only the probe needs this: `sayt integrate` resolves the federated
    # compose graph itself.
    - name: Flatten compose graph
      if: ${{ steps.cache-gate.outputs.active == 'true' }}
      id: flatten
      shell: bash
      working-directory: ${{ inputs.target-dir }}
      run: |
        flat="${RUNNER_TEMP:-/tmp}/sayt-integrate-flat-compose.yaml"
        # --profile "*": root aliases are profile-gated (gen_compose
        # compose.root); without it bake fails to find the target.
        docker compose --profile "*" config -o "$flat"
        echo "flat=$flat" >> "$GITHUB_OUTPUT"

    # --set lines for the digest-probe bake below. Empty cache-from/to +
    # scope set → GHA defaults; empty + no scope → hand off to compose x-bake.
    - name: Compute cache wiring
      if: ${{ steps.cache-gate.outputs.active == 'true' }}
      id: cache-wiring
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.action-cache-scope }}
        CACHE_FROM_INPUT: ${{ inputs.action-cache-from }}
        CACHE_TO_INPUT: ${{ inputs.action-cache-to }}
        TARGET: ${{ inputs.target }}
        CACHE_TARGET_PATTERN: ${{ inputs.action-cache-target-pattern }}
      run: |
        cache_from="$CACHE_FROM_INPUT"
        cache_to="$CACHE_TO_INPUT"
        target_pattern="${CACHE_TARGET_PATTERN:-$TARGET}"
        if [ -z "$cache_from" ] && [ -n "$CACHE_SCOPE" ]; then
          cache_from=$(printf 'type=gha,scope=%s-%s\ntype=gha,scope=main-%s\n' \
            "$CACHE_SCOPE" "$TARGET" "$TARGET")
        fi
        if [ -z "$cache_to" ] && [ -n "$CACHE_SCOPE" ]; then
          cache_to="type=gha,scope=${CACHE_SCOPE}-${TARGET},mode=max"
        fi
        p1=""
        while IFS= read -r line; do
          line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$line" ]; then
            p1+="${target_pattern}.cache-from=${line}"$'\n'
          fi
        done <<< "$cache_from"
        if [ -n "$cache_to" ]; then
          p1+="${target_pattern}.cache-to=${cache_to}"$'\n'
        fi
        {
          echo "p1<<PHASE1_EOF"
          printf '%s' "$p1"
          echo "PHASE1_EOF"
        } >> "$GITHUB_OUTPUT"

    # Digest probe: produces the per-target digest (the marker key)
    # and fills the local content store; the delegated run below loads from
    # it when it actually runs. Runs on the runner's own daemon directly —
    # no bridge needed for a build that isn't inside a sandboxed RUN.
    - name: Build integrate target — digest probe
      if: ${{ steps.cache-gate.outputs.active == 'true' }}
      id: bake
      uses: docker/bake-action@v7
      with:
        source: .
        workdir: ${{ inputs.target-dir }}
        files: ${{ steps.flatten.outputs.flat }}
        targets: ${{ inputs.target }}
        load: false  # the delegated run loads it, on a marker miss
        allow: |
          fs.read=${{ github.workspace }}
        # rewrite-timestamp + BUILDKIT_SYNTAX must match the delegated run's
        # own build, or the digest (and the marker) drifts.
        set: |
          *.output=type=image,push=false,rewrite-timestamp=true
          ${{ inputs.buildkit-syntax != '' && format('*.args.BUILDKIT_SYNTAX={0}', inputs.buildkit-syntax) || '' }}
          ${{ steps.cache-wiring.outputs.p1 }}
        provenance: false
        sbom: false
      env:
        SOURCE_DATE_EPOCH: "0"

    # Marker key = sha256 of the per-target digest map. Via tempfile, not env:
    # the metadata can exceed ARG_MAX.
    - name: Compute digest hash
      if: ${{ steps.cache-gate.outputs.active == 'true' }}
      id: digest
      shell: bash
      run: |
        metadata_file="${RUNNER_TEMP:-/tmp}/sayt-integrate-bake-metadata.json"
        cat > "$metadata_file" <<'SAYT_BAKE_METADATA_EOF'
        ${{ steps.bake.outputs.metadata }}
        SAYT_BAKE_METADATA_EOF
        if [ ! -s "$metadata_file" ] || [ "$(head -c1 "$metadata_file")" != "{" ]; then
          echo "::warning::bake-action produced no/invalid metadata output; skipping cache wiring."
          exit 0
        fi
        hash=$(jq -S 'to_entries
                      | map({k: .key, d: (.value."containerimage.digest" // null)})
                      | sort_by(.k)' "$metadata_file" \
               | sha256sum | cut -d' ' -f1)
        echo "computed digest hash: $hash"
        echo "SAYT_INTEGRATE_DIGEST_HASH=$hash" >> "$GITHUB_ENV"

    - name: Restore passed marker
      if: ${{ steps.cache-gate.outputs.active == 'true' && env.SAYT_INTEGRATE_DIGEST_HASH != '' }}
      id: marker
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/sayt-integrate-passed
        key: integrate-passed-${{ runner.os }}-${{ runner.arch }}-${{ env.SAYT_INTEGRATE_DIGEST_HASH }}

    # The actual work, delegated to the CLI — the one place that builds
    # and/or runs anything. Skipped only on a marker hit. No --builder is
    # passed — see the top-level description and dind.nu's current-builder.
    - name: sayt integrate
      if: ${{ steps.cache-gate.outputs.active != 'true' || steps.marker.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ${{ inputs.target-dir }}
      env:
        BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        SOURCE_DATE_EPOCH: "0"
        BUILDKIT_SYNTAX: ${{ inputs.buildkit-syntax }}
        MODE: ${{ inputs.mode }}
        FLAGS: ${{ inputs.flags }}
      run: |
        case "$MODE" in
          local|compose) mode_flags="" ;;
          bake) mode_flags="--bake --no-up" ;;
          ci) mode_flags="--bake" ;;
          *) echo "sayt/integrate: unknown mode '$MODE' (want local, compose, bake, or ci)" >&2; exit 1 ;;
        esac
        if [ "$MODE" = "local" ]; then
          # No --target: any explicit arg would make the CLI's arg list
          # non-empty, which suppresses .say.yaml's say.integrate.args.
          sayt integrate $mode_flags $FLAGS
        else
          sayt integrate $mode_flags $FLAGS --target "${{ inputs.target }}"
        fi

    # Save marker only on success of an actual run (not a marker hit).
    - name: Touch passed marker
      if: ${{ success() && steps.cache-gate.outputs.active == 'true' && env.SAYT_INTEGRATE_DIGEST_HASH != '' && steps.marker.outputs.cache-hit != 'true' }}
      shell: bash
      run: touch "${{ runner.temp }}/sayt-integrate-passed"

    - name: Save passed marker
      if: ${{ success() && steps.cache-gate.outputs.active == 'true' && env.SAYT_INTEGRATE_DIGEST_HASH != '' && steps.marker.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/sayt-integrate-passed
        key: integrate-passed-${{ runner.os }}-${{ runner.arch }}-${{ env.SAYT_INTEGRATE_DIGEST_HASH }}

    # Default summary-name to the target-dir basename (needs a shell step).
    - name: Resolve summary name
      if: ${{ always() }}
      id: summary
      shell: bash
      env:
        SUMMARY_NAME_INPUT: ${{ inputs.summary-name }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        name="$SUMMARY_NAME_INPUT"
        if [ -z "$name" ]; then
          name=$(basename "$TARGET_DIR")
          [ "$name" = "." ] && name="root"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Cache-hit summary
      if: ${{ always() }}
      uses: bonisoft3/sayt/.github/actions/sayt/summary@v0.28.1
      with:
        name: ${{ steps.summary.outputs.name }}
        builder: ${{ steps.buildx.outputs.name }}
        debug: ${{ inputs.debug }}
