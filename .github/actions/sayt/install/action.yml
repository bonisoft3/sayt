name: sayt/install
description: |
  Install sayt outside the workspace and expose it via GITHUB_PATH, with
  caching. The checkout stays byte-identical; the repo's `.say.yaml`
  version pin remains the version authority.
inputs:
  wrapper-path:
    description: Path to the directory containing saytw and saytw.ps1.
    required: false
    default: "."
  version:
    description: Semver (e.g., 0.0.17 or v0.0.17). Empty uses the wrapper default.
    required: false
    default: ""
  distro-path:
    description: Path to a full sayt distribution to copy into the cache before installing.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Cache saytw downloads
      id: cache-saytw
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/sayt
          ~/Library/Caches/sayt
          ~/.local/share/mise
          ~/Library/Application Support/mise
          ${{ env.LOCALAPPDATA }}\sayt
          ${{ env.LOCALAPPDATA }}\mise
        # actions/cache stores these relative to the workspace, so a cache
        # from a runner whose home sits elsewhere unpacks to no path there:
        # the workspace names the layout.
        key: saytw-v6-${{ runner.os }}-${{ runner.arch }}-${{ github.workspace }}-${{ inputs.version }}-${{ hashFiles(format('{0}/saytw', inputs.wrapper-path), format('{0}/saytw.ps1', inputs.wrapper-path), format('{0}/sayt.sh', inputs.distro-path), format('{0}/sayt.ps1', inputs.distro-path)) }}-${{ hashFiles(format('{0}/*.toml', inputs.distro-path)) }}

    - name: Install sayt on PATH
      shell: bash
      env:
        WRAPPER_PATH: ${{ inputs.wrapper-path }}
        DISTRO_PATH: ${{ inputs.distro-path }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        tool_dir="$RUNNER_TEMP/sayt-tool"
        mkdir -p "$tool_dir"
        if [ -n "$DISTRO_PATH" ]; then
          # Distro mode: shim through the checkout's own launcher.
          printf '#!/bin/sh\nexec "%s/sayt.sh" "$@"\n' "$GITHUB_WORKSPACE/$DISTRO_PATH" > "$tool_dir/sayt"
          chmod +x "$tool_dir/sayt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '& "%s/%s/sayt.ps1" @args; exit $LASTEXITCODE\n' "$GITHUB_WORKSPACE" "$DISTRO_PATH" > "$tool_dir/sayt.ps1"
          fi
        else
          # Empty means "use the wrapper default" — an empty export would
          # otherwise reach the launcher run below with empty in scope.
          if [ -n "$INPUT_VERSION" ]; then
            export SAYT_VERSION="$INPUT_VERSION"
          fi
          cd "$WRAPPER_PATH"
          if [ -x ./saytw ]; then
            ./saytw --help
          else
            curl -fsSL https://raw.githubusercontent.com/bonisoft3/sayt/refs/heads/main/install | sh -s -- --help
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -f "$LOCALAPPDATA/sayt/sayt.exe" "$tool_dir/sayt.exe"
          else
            cp -f "${XDG_CACHE_HOME:-$HOME/.cache}/sayt/sayt" "$tool_dir/sayt"
            chmod +x "$tool_dir/sayt"
          fi
          # Colocate the wrappers so a `.say.yaml` version pin can re-exec.
          if [ -f ./saytw ]; then
            cp -f ./saytw "$tool_dir/saytw"
            chmod +x "$tool_dir/saytw"
          fi
          if [ -f ./saytw.ps1 ]; then
            cp -f ./saytw.ps1 "$tool_dir/saytw.ps1"
          fi
        fi
        echo "$tool_dir" >> "$GITHUB_PATH"
        echo "MISE_TRUSTED_CONFIG_PATHS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "MISE_WINDOWS_SHIM_MODE=file" >> "$GITHUB_ENV"
          echo "BAYT_CACHE_DIR=$GITHUB_WORKSPACE/.cache/bayt" >> "$GITHUB_ENV"
          if [ -x "$tool_dir/sayt.exe" ]; then
            "$tool_dir/sayt.exe" --help
          else
            pwsh -NoLogo -NoProfile -NonInteractive -File "$tool_dir/sayt.ps1" --help
          fi
          mkdir -p "$LOCALAPPDATA/mise/shims"
          for d in "$LOCALAPPDATA/sayt"/mise-* "$LOCALAPPDATA/mise/shims" "$USERPROFILE/.local/share/mise/shims"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done
        else
          "$tool_dir/sayt" --help
          mkdir -p "${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims"
          for d in "${XDG_CACHE_HOME:-$HOME/.cache}/sayt"/mise-* "$HOME/Library/Caches/sayt"/mise-* "${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done
        fi
