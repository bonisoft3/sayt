name: sayt/depot
description: |
  Run a project's bake on depot's remote builders, with every bake in a run
  sharing one declared cache scope. Requires a `DEPOT_TOKEN` env secret, a depot
  project id, and a `depot-*` runner (which provides the `depot` CLI).

inputs:
  target-dir:
    description: Directory containing the project's compose.yaml.
    required: true
  phase:
    description: |
      `full` (default): dindbox `sayt/ci` — build + compose-up in one job.
      `build`: host `depot bake` of the project's committed `.bayt/depot.hcl`
      — builds + pushes the runtime closure with no dindbox (the phase runs no
      containers, so it needs no daemon). `targets` selects what it bakes.
      `run`: host `compose up --no-build` of the closure `build` pushed — also
      no dindbox, since the phase builds nothing for a cache hit to skip.
    required: false
    default: "full"
  targets:
    description: |
      Bake targets — a group name, or target names separated by whitespace or
      commas. Empty is the phase default: `ci` for `full`, the `depot-build`
      group for `build`. Ignored by `run`. No value means "build nothing"; a
      caller with nothing to rebuild skips the action.
    required: false
    default: ""
  flags:
    description: |
      Extra `sayt integrate` flags for `phase: run`, appended after the
      `--no-build` that defines the phase. The escape hatch for capabilities
      the pulled stack needs from the runner: `--with-testcontainers` when a
      composed service spawns its own containers, `--dind` when one wants the
      runner's daemon socket.
    required: false
    default: ""
  depot-project:
    description: Depot project ID.
    required: true
  cache-from:
    description: |
      Passthrough to `sayt/ci` (`phase: full`); also gates the build phase's
      bake. No effect on `phase: run`, which bakes nothing. Opt-in: depot
      builders carry a native cache, so this earns its per-node import
      round-trips either on a pool ephemeral enough that builds rarely re-land
      a warm machine, or as recovery after a builder is wiped.
    required: false
    default: "false"
  cache-to:
    description: |
      As `cache-from`: `sayt/ci` (`phase: full`) plus the build phase's bake,
      and nothing on `phase: run`.
    required: false
    default: "false"
  no-cache:
    description: |
      `phase: build` only — bake reusing nothing, the builder-native cache
      included, which is the tier `cache-from`/`cache-to` cannot reach.
      Recovery for a remote builder that has lost refs under a wide bake
      (`failed to load ref`, `failed to calculate checksum of ref`); the only
      other lever, `depot cache reset`, is scoped to a whole project.

      Drops `cache-from` with it — a solve that reuses nothing has nothing to
      import. `cache-to` is untouched.
    required: false
    default: "false"
  buildkitd-flags:
    description: Passthrough to `sayt/ci`. Optional extra buildkitd flags.
    required: false
    default: ""
  buildkit-syntax:
    description: |
      Dockerfile frontend pin, passed to `sayt/ci`. Pinned by default (unlike
      other flows): depot's fleet rolls mid-run, so outer/inner must share one
      frontend or their cache namespaces split. Bump deliberately — it
      cold-starts the depot cache.
    required: false
    default: "docker/dockerfile:1.26@sha256:ecfaec9ed6d810b56388c508f4121597bfbba70d41a6dfeee4d8cad5f295fc32"
  rewrite-timestamp:
    description: |
      Clamp layer file mtimes to `source-date-epoch` on `phase: build`'s
      export. Inert unless that is set, and inert on the other phases.

      A copy-only leaf does not need it: bayt clamps inside the build and
      `COPY --from` carries those mtimes into the leaf, which is what
      bayt/tests/export_repro_it.nu pins. It earns its keep on a leaf that
      RUNs — the clamp never reaches what a RUN writes, so those layers float
      on rebuild and stop matching the blobs the registry already holds.
    required: false
    default: "true"
  source-date-epoch:
    description: |
      `SOURCE_DATE_EPOCH` for `phase: build` — stamps the image config, and is
      the value `rewrite-timestamp` clamps mtimes to. Empty exports nothing and
      so requires `rewrite-timestamp: false`, which the step enforces rather
      than leaving the pair silently inert. That combination measures the
      exporter alone, not an unclamped build: bayt's own clamp reads
      `${SOURCE_DATE_EPOCH:-0}` and goes on clamping to 0.
    required: false
    default: "0"
  summary-name:
    description: Passthrough to `sayt/ci`. Cache-hit summary section label.
    required: false
    default: ""
  debug:
    description: Passthrough to `sayt/ci` (and through to sayt/summary).
    required: false
    default: "false"
  distro-path:
    description: |
      Passthrough to `sayt/ci` — seeds the sayt distribution so the inner runs
      this repo's sayt (not a published one). Without it the inner falls back to
      the installed sayt, which can break inner secret/frontend threading.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Only the build phase bakes here; the others delegate to sayt/ci, which
    # has no `no-cache`.
    - name: Validate cache inputs
      shell: bash
      env:
        NO_CACHE: ${{ inputs.no-cache }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        for pair in "no-cache:$NO_CACHE" "cache-from:$CACHE_FROM" "cache-to:$CACHE_TO"; do
          case "${pair#*:}" in
            ""|true|false) ;;
            *) echo "::error::${pair%%:*} must be true or false, got '${pair#*:}'"; exit 1 ;;
          esac
        done
        if [ "$NO_CACHE" = true ] && [ "$PHASE" != build ]; then
          echo "::error::no-cache is honoured only by phase: build, not '$PHASE'"; exit 1
        fi

    - name: Log in to Depot Registry
      uses: docker/login-action@v4
      with:
        registry: registry.depot.dev
        username: x-token
        password: ${{ env.DEPOT_TOKEN }}

    # Compose the scope from DECLARED inputs only (branch, project id,
    # frontend) — never probe depot: its fleet rolls mid-run, so a probed value
    # would split a run's bakes across cache namespaces. Every phase of a run
    # scopes by the same pair, so all its bakes share one namespace.
    - name: Compute depot cache scope
      if: ${{ inputs.phase != 'run' }}
      id: scope
      shell: bash
      env:
        BUILDKIT_SYNTAX: ${{ inputs.buildkit-syntax }}
        ENGINE: depot-${{ inputs.depot-project }}
      run: |
        set -euo pipefail
        # Bounds the composed scope, not each dimension, so no dimension can
        # overflow it. Ceiling and why: cache_scope_max in dind.nu.
        bounded() {
          if [ "${#1}" -le 64 ]; then printf '%s' "$1"
          else printf '%s-%s' "$(printf '%s' "$1" | cut -c1-55)" "$(printf '%s' "$1" | sha256sum | cut -c1-8)"
          fi
        }
        sanitize() { printf '%s' "${1#refs/heads/}" | tr -c 'a-zA-Z0-9._-' '-'; }
        # Distinct frontends generate distinct LLB, so each needs its own
        # namespace (see frontend-dim in dind.nu).
        if [ -n "$BUILDKIT_SYNTAX" ]; then
          digest=$(printf '%s' "$BUILDKIT_SYNTAX" | sed -n 's/.*@sha256:\([0-9a-f]\{12\}\).*/\1/p')
          if [ -n "$digest" ]; then
            frontend="df$digest"
          else
            ref="${BUILDKIT_SYNTAX%%@*}"
            frontend="df$(sanitize "${ref##*:}")"
          fi
        else
          frontend=builtin
        fi
        branch=$(sanitize "${BRANCH:-main}")
        [ -n "$branch" ] || branch=main
        engine="$ENGINE-$frontend"
        {
          echo "scope=$(bounded "$branch-$engine")"
          echo "fallback=$(bounded "main-$engine")"
        } | tee -a "$GITHUB_OUTPUT"

    # csv because the consumers disagree: `depot bake` takes targets as argv
    # words, `sayt integrate --target` as one comma-separated value.
    - name: Resolve bake targets
      if: ${{ inputs.phase != 'run' }}
      id: targets
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        # `read` takes one line, so newlines must go before it runs or a block
        # scalar would resolve to its first target and bake a silent subset.
        _flat=${TARGETS//,/ }
        read -r -a names <<<"${_flat//$'\n'/ }"
        if [ "${#names[@]}" -eq 0 ]; then
          case "$PHASE" in
            build) names=(depot-build) ;;
            *) names=(ci) ;;
          esac
        fi
        printf 'targets=%s\n' "$(IFS=,; printf '%s' "${names[*]}")" | tee -a "$GITHUB_OUTPUT"

    # ---- build phase: flat host `depot bake`, no dindbox ----
    - name: Bake + push runtime closure
      if: ${{ inputs.phase == 'build' }}
      shell: bash
      env:
        DEPOT_TOKEN: ${{ env.DEPOT_TOKEN }}
        REWRITE_TIMESTAMP: ${{ inputs.rewrite-timestamp }}
        EPOCH: ${{ inputs.source-date-epoch }}
        BAYT_IMAGE_TAG: ${{ github.sha }}
        CACHE_SCOPE: ${{ steps.scope.outputs.scope }}
        CACHE_SCOPE_FALLBACK: ${{ steps.scope.outputs.fallback }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
        NO_CACHE: ${{ inputs.no-cache }}
        TARGET_DIR: ${{ inputs.target-dir }}
        DEPOT_PROJECT_ID: ${{ inputs.depot-project }}
        BUILDKIT_SYNTAX: ${{ inputs.buildkit-syntax }}
        TARGETS: ${{ steps.targets.outputs.targets }}
      run: |
        set -euo pipefail
        # The output is an exporter ATTRIBUTE LIST, so a value carrying a comma
        # appends attributes of its own: `name=` redirects the push,
        # `force-compression=` (empty parses true) reinstates what this action
        # declines to offer. Hence validate, then compose — never interpolate
        # into the list.
        case "$REWRITE_TIMESTAMP" in
          true|false) ;;
          *) echo "::error::rewrite-timestamp must be true or false, got '$REWRITE_TIMESTAMP'"; exit 1 ;;
        esac
        if [ "$REWRITE_TIMESTAMP" = true ] && [ -z "$EPOCH" ]; then
          echo "::error::rewrite-timestamp needs source-date-epoch; without one it is inert, and silently so"; exit 1
        fi
        # Exporter attrs, so they stay off local loads. The level is buildkit's
        # zstd scale, not the zstd CLI's, and is stated so the pin survives a
        # change to buildkit's default. Pulling zstd needs Docker 23.0+;
        # BuildKit, containerd and imagetools all read it.
        export BAYT_COMPOSE_OUTPUT="registry,rewrite-timestamp=$REWRITE_TIMESTAMP,compression=zstd,compression-level=3"
        # An `env:` entry cannot express absent — it would export the empty
        # string, which rewrite-timestamp reads as an unparseable epoch.
        [ -z "$EPOCH" ] || export SOURCE_DATE_EPOCH="$EPOCH"
        cache=()
        if [ "$NO_CACHE" = "true" ]; then
          cache+=(--no-cache --set "*.cache-from=")
        else
          [ "$CACHE_FROM" = "true" ] || cache+=(--set "*.cache-from=")
        fi
        [ "$CACHE_TO" = "true" ] || cache+=(--set "*.cache-to=")
        IFS=, read -r -a targets <<<"$TARGETS"
        # The default `depot-build` is the runtime-closure group bayt emits in
        # depot.hcl — every image the run phase pulls, each pushed by its own
        # output. Build-only intermediates are baked implicitly as `target:`
        # contexts (cache-only). Frontend pinned via the arg depot honors (its
        # embedded parser lacks COPY --parents, and `# syntax=` can't be
        # committed).
        #
        # depot.yaml is the pre-flattened graph; its ${VARS} resolve from the
        # env below. depot.hcl is the group.
        # depot exposes no build-history API; sayt/summary parses this log.
        # Keep `set -o pipefail` above or the tee swallows a failed bake.
        #
        # Attestations off via the flags, not BUILDX_NO_DEFAULT_ATTESTATIONS:
        # that env var never reaches a `depot bake` plan, so the exporter still
        # writes attestation manifests for every leaf. The flags resolve to a
        # per-target `attest: [{disabled: true}]`, which travels in the plan and
        # so does not depend on depot's CLI reading buildx's environment.
        depot bake -f "$TARGET_DIR/.bayt/depot.yaml" -f "$TARGET_DIR/.bayt/depot.hcl" \
          --project "$DEPOT_PROJECT_ID" \
          "${cache[@]+"${cache[@]}"}" \
          --provenance=false --sbom=false \
          --set "*.args.BUILDKIT_SYNTAX=$BUILDKIT_SYNTAX" \
          --progress plain \
          "${targets[@]+"${targets[@]}"}" 2>&1 | tee "$RUNNER_TEMP/sayt-depot-bake.log"

    # run/full phases report through sayt/integrate and sayt/ci.
    - name: Cache-hit summary
      if: ${{ always() && inputs.phase == 'build' }}
      uses: bonisoft3/sayt/.github/actions/sayt/summary@v0.37.3
      with:
        # Most call sites leave summary-name unset.
        name: ${{ inputs.summary-name || inputs.target-dir }}
        progress-log: ${{ runner.temp }}/sayt-depot-bake.log
        debug: ${{ inputs.debug }}

    # ---- run phase: host compose up of the pushed closure, no dindbox ----
    # COMPOSE_FILE is relative to target-dir, this step's cwd. Only the closure
    # defines the reserved `bayt` alias; the federation root has no such
    # service.
    - uses: bonisoft3/sayt/.github/actions/sayt/integrate@v0.37.3
      if: ${{ inputs.phase == 'run' }}
      with:
        target-dir: ${{ inputs.target-dir }}
        target: bayt
        mode: compose
        flags: --no-build ${{ inputs.flags }}
        # A digest probe would bake a graph this phase never builds.
        action-cache: "false"
        distro-path: ${{ inputs.distro-path }}
        summary-name: ${{ inputs.summary-name }}
        debug: ${{ inputs.debug }}
      env:
        COMPOSE_FILE: .bayt/compose.integrate.closure.yaml
        # The closure is only fully materialized with every profile on.
        COMPOSE_PROFILES: "*"
        # The closure defaults pull_policy to `build`, which under --no-build
        # fails on a missing image instead of pulling what `build` pushed.
        BAYT_PULL_POLICY: missing
        BAYT_IMAGE_TAG: ${{ github.sha }}
        # The closure's image refs read these; their defaults name a fixed
        # project, so omitting them silently pulls from the wrong one.
        DEPOT_PROJECT_ID: ${{ inputs.depot-project }}
        DEPOT_ORG_ID: ${{ env.DEPOT_ORG_ID }}

    # ---- full phase: build + up in one dindbox, via sayt/ci ----
    - uses: bonisoft3/sayt/.github/actions/sayt/ci@v0.37.3
      if: ${{ inputs.phase == 'full' }}
      with:
        target-dir: ${{ inputs.target-dir }}
        target: ${{ steps.targets.outputs.targets }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkit-syntax: ${{ inputs.buildkit-syntax }}
        distro-path: ${{ inputs.distro-path }}
        summary-name: ${{ inputs.summary-name }}
        debug: ${{ inputs.debug }}
      env:
        # The inner's bakes belong in the depot cache namespace, not the one
        # dind.nu would derive from the host builder.
        INNER_CACHE_SCOPE: ${{ steps.scope.outputs.scope }}
        INNER_CACHE_SCOPE_FALLBACK: ${{ steps.scope.outputs.fallback }}
        # Selects the inner bake's depot path; integrate.nu transports these in
        # as compose secrets.
        DEPOT_TOKEN: ${{ env.DEPOT_TOKEN }}
        DEPOT_PROJECT_ID: ${{ inputs.depot-project }}
        DEPOT_ORG_ID: ${{ env.DEPOT_ORG_ID }}
        # Deterministic image tag so a build phase (target=*-build, pushes the
        # compose closure) and a run phase (target=*-run, pulls it) on separate
        # jobs agree on the ref. Harmless for single-phase consumers: the loaded
        # image just gets tagged :$SHA instead of :latest.
        BAYT_IMAGE_TAG: ${{ github.sha }}
