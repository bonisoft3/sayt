#!/usr/bin/env -S mise tool-stub
# `docker compose` dispatches to a cli-plugin resolved from the host's
# cli-plugins dirs, and the docker tarball ships none — the version would be
# whatever the host installed. sayt runs this binary directly instead.
# Held at v2.40.3, the last release vendoring compose-go v2.9.x:
# compose-go >= v2.10.0 (CLI v5.x) re-merges diamond includes once per
# include path, multiplying x-* list entries (compose-spec/compose-go#906).
# Bump past v5 when that lands.
bin = "compose"

[platforms.darwin-arm64]
url = "https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-darwin-aarch64"
checksum = "sha256:8cd7eb5f95bacb536cc407111662e2c205d67d9abfea5dcb8400be8418db60d1"

